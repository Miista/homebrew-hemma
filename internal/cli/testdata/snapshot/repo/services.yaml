hosts:
    edge:
        ip: 192.0.2.20
        ssh: ops@192.0.2.20
        trusted_proxies:
            - 198.51.100.10/32
    core:
        ip: 192.0.2.10
        trusted_proxies:
            - 198.51.100.10/32
domains:
    - home.example
defaults:
    dns_host: core
    auth_snippet: shared/auth.caddy
    auth_service: sso
    tunnel_dir: cloudflared
    deploy_host: core
    local_networks:
        - 192.0.2.0/24
services:
    dash:
        fqdn: dash.home.example
        host: edge
        backend: dash:3000
        auth: oidc
        tunnel: true
    shelf:
        fqdn: shelf.home.example
        host: edge
        backend: shelf:80
        disabled: true
        auth:
            mode: forward
            groups:
                - readers
            policy:
                local: bypass
                public: one_factor
        tunnel: true
    sso:
        fqdn: auth.home.example
        host: core
        backend: sso:9091
        tunnel: true
    robot:
        fqdn: robot.home.example
        host: edge
        backend: robot:8765
        auth:
            mode: forward
            groups:
                - admins
            bypass_paths:
                - /healthz
        tunnel: true
    indexer:
        fqdn: indexer.home.example
        host: edge
        backend: indexer:6767
        auth:
            mode: forward
            groups:
                - operators
            bypass_paths:
                - /api/system/ping
            policy:
                local: one_factor
                public: one_factor
        tunnel: true
    wiki:
        fqdn: wiki.home.example
        host: edge
        backend: wiki:3000
        auth:
            mode: forward
            groups:
                - admins
            policy:
                local: bypass
                public: one_factor
        tunnel: true
    status:
        fqdn: status.home.example
        host: core
        backend: status:8080
        auth:
            mode: forward
            groups:
                - admins
            bypass_paths:
                - /health
                - /api/v1/endpoints/*
        tunnel: true
    panel:
        fqdn: panel.home.example
        host: core
        backend: host.docker.internal:8080
        auth:
            mode: forward
            groups:
                - admins
    home:
        fqdn: ha.home.example
        host: core
        backend: host.docker.internal:8123
        auth: external
        tunnel: true
    media:
        fqdn: watch.home.example
        host: edge
        backend: media:8096
        auth: external
        tunnel: true
    music:
        fqdn: music.home.example
        host: edge
        backend: music:4533
        auth:
            mode: forward
            groups:
                - readers
            bypass_paths:
                - /rest/*
                - /share/*
                - /ping
        tunnel: true
    homepage:
        fqdn: start.home.example
        host: core
        backend: homepage:3000
        auth:
            mode: forward
            bypass_paths:
                - /api/healthcheck
            policy:
                local: one_factor
        tunnel: true
    downloads:
        fqdn: downloads.home.example
        host: edge
        backend: vpn:8090
    registry:
        fqdn: registry.home.example
        host: core
        backend: registry:5000
    chat:
        fqdn: chat.home.example
        host: edge
        backend: chat:9000
        auth: external
    speed:
        fqdn: speed.home.example
        host: edge
        backend: speed-tracker:80
        auth:
            mode: forward
            groups:
                - admins
    wikijs:
        fqdn: docs.home.example
        host: edge
        backend: docs:8000
        auth: oidc
        tunnel: true
