# hemma-ui — web UI for the fleet. Run it on the deploy host (defaults.deploy_host): Deploy is
# `hemma deploy`, which pulls and applies on every host over ssh and on this one last (see the
# ssh mounts below).
# Sign-in is handled by authy (github.com/miista/authy) and cannot be switched off.
#   - Recommended: set the four HEMMA_UI_OIDC_* variables below and let your IdP (Authelia, …)
#     decide who may sign in. Register a confidential client with redirect URI
#     <BASE_URL>/auth/callback; restrict the client to your admins at the IdP.
#   - With no OIDC variables, the FIRST visitor creates a local account: create it yourself,
#     immediately after starting, before anyone else can reach the port.
# Put it behind your Caddy (TLS) and keep it LAN-only: the Docker socket mount below
# gives this container root-equivalent control of the host.
# The image only COPIES a binary in; it never compiles Go. Cross-compile it first (UI_ARCH=amd64 for an x86 host):
#   make ui-binary && docker compose -f docker-compose.ui.yml up -d --build
services:
  hemma-ui:
    build: { context: ., dockerfile: Dockerfile.ui }
    network_mode: host            # apply identifies the host by local IP
    # Runs as you, not root: uid 1000 is the image's `hemma` user (passwd entry + owned /data/auth,
    # see Dockerfile.ui). A different uid needs its own passwd entry.
    user: "1000:1000"
    # Reach the Docker socket: the host's docker group id (`getent group docker`).
    group_add: ["${DOCKER_GID:-984}"]
    environment:
      HOME: /data                 # git and ssh keep their files under /data
      HEMMA_UI_ADDR: ":8080"
      # OIDC sign-in (all four together; omit them all to use the local account instead):
      # HEMMA_UI_OIDC_ISSUER: https://auth.example.com
      # HEMMA_UI_OIDC_CLIENT_ID: hemma-ui
      # HEMMA_UI_OIDC_CLIENT_SECRET: ${HEMMA_UI_OIDC_CLIENT_SECRET}
      # HEMMA_UI_OIDC_BASE_URL: https://hemma.example.com
      # HEMMA_UI_LOCAL_ENABLED: "true"    # optional break-glass local account next to OIDC
      # Author of the commits made from the UI's "Commit changes" dialog.
      HEMMA_UI_GIT_NAME: ${HEMMA_UI_GIT_NAME:-hemma-ui}
      HEMMA_UI_GIT_EMAIL: ${HEMMA_UI_GIT_EMAIL:-hemma-ui@localhost}
    volumes:
      - ${HEMMA_REPO_DIR:?set HEMMA_REPO_DIR}:/repo
      - hemma-ui-auth:/data/auth      # authy's session-signing key and sign-out records (and the local account, if used)
      - /var/run/docker.sock:/var/run/docker.sock
      # `deploy` ssh's to every other host in the fleet (hosts[].ssh, default the host name), and
      # syncs with the repo's origin (pull --rebase, then push). Both need credentials inside the container;
      # none are baked in. Mount ONLY the files needed (not all of ~/.ssh), read-only. ssh reads
      # them from ~ = /data; the key must be readable by uid 1000 (mode 600, owned by you):
      # - ${HOME}/.ssh/id_ed25519:/data/.ssh/id_ed25519:ro
      # - ${HOME}/.ssh/known_hosts:/data/.ssh/known_hosts:ro
      # Use full user@host destinations in hosts[].ssh: an ssh config file is not mounted.
      # Single-host setups need none of this.
    restart: unless-stopped
volumes:
  hemma-ui-auth:
