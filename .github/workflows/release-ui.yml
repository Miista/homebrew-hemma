name: Release UI image

# Publishes ghcr.io/miista/hemma-ui when a ui-v<X.Y.Z> tag is pushed. It is independent of the CLI release (release.yml, cli-v<X.Y.Z> tags):
# the two have their own version numbers, and tagging one does not release the other. Tag the image when the UI or the kernel
# (everything both are built from) changed; tag the CLI when the CLI or the kernel changed.
#
# goreleaser (.goreleaser.ui.yaml) cross-compiles the binaries on the runner and builds Dockerfile.ui for linux/amd64 and
# linux/arm64 (QEMU only runs the image's own RUN steps). The open-source goreleaser only accepts a plain semver tag, so this
# workflow strips the prefix (ui-v0.3.0 -> v0.3.0) and hands that to goreleaser as the version.
#
# The GitHub release ("ui vX.Y.Z", on the ui-v tag, no files) is made here, not by goreleaser: its notes are the commit
# subjects since the previous ui-v tag — filtered like the CLI's changelog — and a compare link between the two tags.
# goreleaser cannot write that one, because the only tag it can parse is the bare version, which does not exist in git.
#
# A manual run is a dry run: it builds with the version you give and publishes nothing.

on:
  push:
    tags:
      - "ui-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Dry run: build with this version, v<X.Y.Z>. Nothing is pushed."
        required: true
        default: "v0.0.0"

permissions:
  contents: read

concurrency:
  group: release-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release on the ui-v tag
      packages: write # push to ghcr.io with the workflow's own GITHUB_TOKEN; nothing else is granted
    env:
      # Passed through the environment, never interpolated into the script.
      EVENT: ${{ github.event_name }}
      TAG: ${{ github.ref_name }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the release notes need the history back to the previous ui-v tag

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Version from the tag
        id: version
        run: |
          if [ "$EVENT" = push ]; then
            version="${TAG#ui-}"
            skip="validate"
            publish=true
          else
            version="$INPUT_VERSION"
            skip="validate,publish"
            publish=false
          fi
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not a version. Tag the image ui-vX.Y.Z (for example ui-v0.1.0)."
            exit 1
          fi
          {
            echo "version=$version"
            echo "skip=$skip"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing the UI image as $version (publish: $publish)"

      # The image's RUN steps (apk add, adduser) run under emulation for the architecture the runner is not.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --skip=validate: goreleaser would refuse the bare version below, because that tag does not exist in git (the tag is
      # ui-v<X.Y.Z>); the version has just been checked above.
      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --skip=${{ steps.version.outputs.skip }} -f .goreleaser.ui.yaml
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The notes: every commit since the previous ui-v tag, newest last, minus the noise the CLI's changelog also drops
      # (chore/docs/test/ci prefixes, the formula bump, merges), then the compare link. The first image release lists
      # every commit and has no link. Written to a file: subjects are not interpolated into the script.
      - name: Release notes
        if: steps.version.outputs.publish == 'true'
        id: notes
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 --match 'ui-v*' "$TAG^" 2>/dev/null || true)
          {
            if [ -n "$prev" ]; then
              echo "## Changes since $prev"
            else
              echo "## Changes"
            fi
            echo
            git log --reverse --format='- %s (%h)' ${prev:+"$prev.."}"$TAG" \
              | grep -Ev -- '^- (chore|docs|test|ci)(\(.+\))?:' \
              | grep -Ev -- '^- (Brew formula update|Merge[: ])' \
              || echo "- (no user-facing changes)"
            echo
            echo "Pull: \`docker pull ghcr.io/miista/hemma-ui:${VERSION#v}\`"
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${TAG}"
            fi
          } > "$RUNNER_TEMP/notes.md"
          echo "file=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/notes.md"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      # On the ui-v tag, titled by product like the CLI's ("cli vX.Y.Z"), no files: the image on ghcr.io is the artifact.
      # A re-run finds the release already there and leaves it.
      - name: GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.notes.outputs.file }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --title "ui $VERSION" --notes-file "$NOTES" --verify-tag
          fi

      - name: Summary
        run: |
          {
            echo "### hemma-ui image"
            echo "- version: \`${{ steps.version.outputs.version }}\`"
            echo "- published: \`${{ steps.version.outputs.publish }}\`"
            if [ "${{ steps.version.outputs.publish }}" = true ]; then
              echo "- pull: \`docker pull ghcr.io/miista/hemma-ui:${{ steps.version.outputs.version }}\` (without the leading v)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
