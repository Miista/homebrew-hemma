<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hemma</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
  nav { display: flex; gap: .3rem; flex-wrap: wrap; border-bottom: 1px solid #8884; margin: 1rem 0; }
  nav button { border: 0; background: none; padding: .5rem .9rem; font-size: 1rem; border-bottom: 3px solid transparent; }
  nav button.on { border-color: #36c; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
  th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid #8884; vertical-align: top; }
  tr.off td { opacity: .5; }
  button { padding: .35rem .8rem; cursor: pointer; }
  button.primary { font-weight: 600; }
  td button { margin-right: .3rem; }
  dialog { min-width: min(520px, 92vw); }
  label { display: block; margin: .6rem 0 .2rem; font-size: .85rem; }
  input:not([type=checkbox]), select { width: 100%; padding: .35rem; box-sizing: border-box; }
  pre { background: #8882; padding: .8rem; overflow: auto; max-height: 26rem; white-space: pre-wrap; }
  .err { color: #c33; } .meta { opacity: .7; font-size: .85rem; }
  .row { display: flex; gap: .5rem; justify-content: flex-end; margin-top: 1rem; }
  .cards { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1rem 0; }
  .banner { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .6rem .9rem; margin: 1rem 0; border: 1px solid #d90; border-radius: 6px; background: #fa02; }
  [hidden] { display: none !important; } /* class display rules (.banner) must not defeat `hidden` */
  textarea { width: 100%; box-sizing: border-box; padding: .35rem; font: inherit; }
</style>
</head>
<body>
<h1>hemma</h1>
<p class="meta" id="summary"></p>
<nav id="tabs"></nav>
<div id="banner" class="banner" hidden></div>
<section id="view"></section>
<pre id="out" hidden></pre>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dtitle"></h2>
    <p class="meta" id="dhelp"></p>
    <div id="fields"></div>
    <p class="err" id="derr"></p>
    <div class="row"><button type="button" id="cancel">Cancel</button><button class="primary" id="go">Run</button></div>
  </form>
</dialog>

<dialog id="cdlg">
  <form method="dialog" id="cform">
    <h2>Commit changes</h2>
    <p class="meta">These changes are in the repo but not committed. They go live only after you commit them with a message.</p>
    <pre id="cfiles"></pre>
    <label>Change message *<textarea id="cmsg" rows="3" required maxlength="2000" placeholder="e.g. Add paperless and move grafana to nas"></textarea></label>
    <label id="cpushl"><input type="checkbox" id="cpush"> Push to origin after committing (deploy pulls from origin)</label>
    <p class="err" id="cerr"></p>
    <div class="row"><button type="button" id="ccancel">Cancel</button><button id="cgo">Commit</button><button class="primary" id="cdeploy">Commit and deploy</button></div>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s);
let changes = { git: false, files: [] };
let state = { services: [], hosts: [], domains: [], defaults: {} };
let cmds = {};
let tab = "Services";
const TABS = ["Services", "Hosts", "Domains", "Defaults", "Diagnose", "About"];

async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const text = await r.text();
  try { return JSON.parse(text); } catch { return { ok: false, output: `HTTP ${r.status}: ${text}` }; }
}
function show(res) {
  const o = $("#out"); o.hidden = false; o.className = res.ok ? "" : "err";
  o.textContent = (res.ok ? "OK\n" : "FAILED\n") + (res.output || res.error || "");
  o.scrollIntoView({ block: "nearest" });
}
function el(tag, text, props) { const e = document.createElement(tag); if (text != null) e.textContent = text; return Object.assign(e, props || {}); }
function btn(label, fn, cls) { const b = el("button", label, { onclick: fn }); if (cls) b.className = cls; return b; }

// run executes an allowlisted command directly (no form), then refreshes.
async function run(key, values, confirmMsg) {
  if (confirmMsg && !confirm(confirmMsg)) return;
  const res = await post("/api/run", { command: key, values });
  show(res); if (!cmds[key].readonly) load();
}

// openCmd renders a form from the command's schema; prefill pre-populates it.
function openCmd(key, prefill = {}) {
  const c = cmds[key], f = $("#form");
  $("#dtitle").textContent = c.title; $("#dhelp").textContent = c.help || ""; $("#derr").textContent = "";
  const box = $("#fields"); box.replaceChildren();
  const inputs = {};
  for (const fd of c.fields) {
    const lab = el("label", fd.label + (fd.required ? " *" : ""));
    let inp;
    if (fd.kind === "select" || fd.options) {
      inp = el("select");
      for (const o of fd.options) inp.append(new Option(o === "" ? "(none)" : o, o));
    } else if (fd.kind === "bool") { inp = el("input", null, { type: "checkbox" }); }
    else if (fd.kind === "int") { inp = el("input", null, { type: "number", min: 0, max: 1000 }); }
    else { inp = el("input", null, { type: "text", autocomplete: "off" }); }
    const v = prefill[fd.name];
    if (v !== undefined) { if (fd.kind === "bool") inp.checked = !!v; else inp.value = v; }
    if (prefill.__lock === fd.name) inp.readOnly = true, inp.disabled = fd.kind === "select";
    if (fd.kind === "bool") { lab.prepend(inp); } else { lab.append(inp); }
    box.append(lab); inputs[fd.name] = { fd, inp };
  }
  $("#go").onclick = async e => {
    e.preventDefault();
    if (!f.reportValidity()) return;
    const values = {};
    for (const [n, { fd, inp }] of Object.entries(inputs)) {
      if (fd.kind === "bool") values[n] = inp.checked;
      else if (fd.kind === "int") { if (inp.value !== "") values[n] = Number(inp.value); }
      else if (inp.value !== "" || c.update) values[n] = inp.value;
    }
    if (c.confirm && !confirm(c.confirm)) return;
    $("#go").disabled = true;
    try {
      const res = await post("/api/run", { command: key, values });
      if (!res.ok) { $("#derr").textContent = res.output; return; }
      $("#dlg").close(); show(res); if (!c.readonly) load();
    } finally { $("#go").disabled = false; }
  };
  $("#dlg").showModal();
}
$("#cancel").onclick = () => $("#dlg").close();

function table(headers, rows) {
  const t = el("table"), h = el("tr"); headers.forEach(x => h.append(el("th", x)));
  t.append(el("thead")); t.firstChild.append(h);
  const b = el("tbody"); rows.forEach(r => b.append(r)); t.append(b); return t;
}
function row(cells, actions, off) {
  const tr = el("tr"); if (off) tr.className = "off";
  cells.forEach(c => tr.append(el("td", c)));
  const a = el("td"); (actions || []).forEach(x => a.append(x)); tr.append(a); return tr;
}
const cards = list => { const d = el("div"); d.className = "cards"; list.forEach(x => d.append(x)); return d; };
// Going live needs a clean tree: uncommitted changes must be committed (with a message) first.
// The server enforces the same rule, so this is only the friendly path.
const GATED = ["apply"];
const cmdBtn = (key, label, prefill) => btn(label || cmds[key].title, () => {
  if (GATED.includes(key) && changes.files.length) return openCommit();
  openCmd(key, prefill);
}, "");

async function pushNow() {
  const res = await post("/api/push", {}); show(res); await load(); return res.ok;
}
// goLive deploys: pull from origin, then apply. With no origin there is nothing to pull, so it
// just applies this machine's committed config. Unpushed commits are pushed first (with consent).
async function goLive() {
  const key = changes.has_remote ? "deploy" : "apply";
  if (changes.has_remote && changes.ahead > 0 &&
      !(confirm(`${changes.ahead} commit(s) are not on origin yet — push them first?`) && await pushNow())) return;
  await run(key, {}, cmds[key].confirm);
}

// openCommit: write the change message; optionally carry straight on to deploying.
function openCommit() {
  $("#cfiles").textContent = changes.files.map(f => `${f.status.padEnd(2)} ${f.path}`).join("\n");
  $("#cmsg").value = ""; $("#cerr").textContent = "";
  $("#cpush").checked = false; $("#cpushl").hidden = !changes.has_remote;
  $("#cdeploy").textContent = changes.has_remote ? "Commit and deploy" : "Commit and apply";
  const submit = async andLive => {
    if (!$("#cform").reportValidity()) return;
    $("#cgo").disabled = $("#cdeploy").disabled = true;
    try {
      // Deploying pulls from origin, so "commit and deploy" always pushes when there is one.
      const push = andLive ? changes.has_remote : $("#cpush").checked;
      const res = await post("/api/commit", { message: $("#cmsg").value, push });
      if (!res.ok) { $("#cerr").textContent = res.output; return; }
      $("#cdlg").close(); show(res); await load();
      if (andLive) await goLive();
    } finally { $("#cgo").disabled = $("#cdeploy").disabled = false; }
  };
  $("#cgo").onclick = e => { e.preventDefault(); submit(false); };
  $("#cdeploy").onclick = e => { e.preventDefault(); submit(true); };
  $("#cdlg").showModal();
}
$("#ccancel").onclick = () => $("#cdlg").close();

// The banner lives on the Services page and only appears when there is something to deploy.
function renderBanner() {
  const b = $("#banner"), n = changes.files.length;
  b.hidden = tab !== "Services" || !changes.git || !(n || changes.undeployed);
  if (b.hidden) return;
  if (n) b.replaceChildren(el("span", `${n} uncommitted ${n === 1 ? "change" : "changes"} — commit them to deploy.`),
    btn("Review and commit", openCommit, "primary"));
  else b.replaceChildren(el("span", "Committed changes have not been deployed yet."),
    btn(changes.has_remote ? "Deploy" : "Apply", goLive, "primary"));
}

const VIEWS = {
  Services() {
    const rows = state.services.map(s => row(
      [s.name, s.fqdn, s.host, s.backend, s["auth-mode"] || "none", s.tunnel ? "yes" : "no"],
      [btn("Edit", () => openCmd("update service", { ...s, __lock: "name" })),
       btn(s.disabled ? "Enable" : "Disable", () => run(s.disabled ? "enable service" : "disable service", { name: s.name })),
       btn("Rename", () => openCmd("rename service", { old: s.name, __lock: "old" })),
       btn("Remove", () => run("remove service", { name: s.name }, cmds["remove service"].confirm))], s.disabled));
    return [cards([cmdBtn("add service")]), table(["Name", "FQDN", "Host", "Backend", "Auth", "Internet", ""], rows)];
  },
  Hosts() {
    const rows = state.hosts.map(h => row([h.name, h.ip, h["trusted-proxies"] || "—"],
      [btn("Edit", () => openCmd("update host", { ...h, __lock: "name" })),
       btn("Remove", () => run("remove host", { name: h.name }, cmds["remove host"].confirm))]));
    return [cards([cmdBtn("add host")]), table(["Name", "IP", "Extra trusted proxies", ""], rows)];
  },
  Domains() {
    const rows = state.domains.map(d => row([d], [btn("Remove", () => run("remove domain", { name: d }, cmds["remove domain"].confirm))]));
    return [cards([cmdBtn("add domain")]), table(["Domain", ""], rows)];
  },
  Defaults() {
    const rows = Object.entries(state.defaults).map(([k, v]) => row([k, v || "(unset)"], [btn("Change", () => openCmd("defaults set", { key: k, value: v, __lock: "key" }))]));
    return [table(["Setting", "Value", ""], rows)];
  },
  Diagnose() { return [cards(["list", "verify", "measure", "doctor", "apply"].map(k => cmdBtn(k))),
    el("p", "Apply re-applies the committed config on this machine without pulling. Deploying new changes is done from the Services page.", { className: "meta" })]; },
  About() { return [cards(["version", "help", "completion", "defaults"].map(k => cmdBtn(k)))]; },
};

function render() {
  $("#summary").textContent = `${state.services.length} services · ${state.hosts.length} hosts · ${state.domains.join(", ")}`;
  const nav = $("#tabs"); nav.replaceChildren();
  TABS.forEach(t => nav.append(btn(t, () => { tab = t; render(); }, t === tab ? "on" : "")));
  $("#view").replaceChildren(...VIEWS[tab]());
  renderBanner();
}
async function load() {
  const r = await fetch("/api/state"); const s = await r.json();
  if (s.error) { show({ ok: false, output: s.error }); return; }
  state = s;
  changes = await (await fetch("/api/changes")).json();
  render();
}
(async () => {
  const list = await (await fetch("/api/commands")).json();
  list.forEach(c => cmds[c.key] = c);
  render(); load();
})();
</script>
</body>
</html>
