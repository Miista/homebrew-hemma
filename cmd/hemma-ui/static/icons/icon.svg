      <stop offset="0" stop-color="#4f93e6"/>
      <stop offset="1" stop-color="#f3f5f8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="183" fill="#0d1824"/>
  <path fill="none" stroke="url(#g)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"
        d="M190 216.5V381.5M322 216.5V381.5M190 302.3H322M190 170.5L244.1 137.7Q256 128.3 267.9 137.7L322 170.5"/>
</svg>
